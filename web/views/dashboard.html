<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0d1a">
<title>FuriMusic - Admin Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner-ring"></div>
  <div class="loading-text" id="loadingText">Loading...</div>
</div>

<div class="app">
  <header class="navbar">
    <a href="/admin" class="navbar-brand">
      <div class="navbar-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <span class="navbar-title">FuriMusic</span>
      <span class="navbar-version js-version">v&ndash;</span>
    </a>
    <div class="navbar-links" id="navLinks">
      <span class="navbar-pill"><span class="navbar-dot" id="topbarDot"></span><span id="topbarStatus">Loading...</span></span>
      <a href="/" class="navbar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        Status
      </a>
      <button class="navbar-link" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Logout
      </button>
    </div>
    <button class="navbar-hamburger" id="navHamburger" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
  </header>
  <div class="navbar-overlay" id="navOverlay"></div>

  <main class="page-content" id="pageContent"></main>
</div>

<script>
document.getElementById('navHamburger')?.addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
  document.getElementById('navOverlay').classList.toggle('open');
});
document.getElementById('navOverlay')?.addEventListener('click', () => {
  document.getElementById('navLinks').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('open');
});

(function() {
  let n = 0;
  const dots = ['Loading.', 'Loading..', 'Loading...'];
  const el = document.getElementById('loadingText');
  setInterval(() => { n = (n + 1) % dots.length; el.textContent = dots[n]; }, 400);
})();
</script>
<script src="/app.js"></script>
</body>
</html>
